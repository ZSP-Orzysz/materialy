name: Aktualizuj listę plików dla uczniów

on:
  push:
    branches:
      - main
    paths:
      - 'docs/klasa-*/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Wygeneruj docs/index.html
        run: |
          python3 - << 'EOF'
          import os, html

          klasy = [
              ("klasa-4", "Klasa 4"),
              ("klasa-5", "Klasa 5"),
              ("klasa-6", "Klasa 6"),
              ("klasa-7", "Klasa 7"),
              ("klasa-8", "Klasa 8"),
          ]
          ignorowane = {"info.txt", "readme.txt", ".gitkeep"}

          sekcje = []
          for folder, tytul in klasy:
              sciezka = os.path.join("docs", folder)
              pliki = []
              if os.path.isdir(sciezka):
                  for nazwa in sorted(os.listdir(sciezka)):
                      pelna = os.path.join(sciezka, nazwa)
                      if os.path.isfile(pelna) and nazwa.lower() not in ignorowane and not nazwa.startswith("."):
                          pliki.append(nazwa)
              if not pliki:
                  elementy = '      <li class="brak">Brak aktualnych plików do pobrania.</li>'
              else:
                  wiersze = []
                  for nazwa in pliki:
                      ext = os.path.splitext(nazwa)[1].lower()
                      etykieta = f"Pobierz {ext}" if ext else "Pobierz"
                      bezpieczna = html.escape(nazwa)
                      wiersze.append(
                          f'      <li>\n'
                          f'        <span><code>{bezpieczna}</code></span>\n'
                          f'        <a class="btn" href="{folder}/{bezpieczna}" download>{etykieta}</a>\n'
                          f'      </li>'
                      )
                  elementy = "\n".join(wiersze)
              sekcje.append(f'  <section class="klasa">\n    <h2>{tytul}</h2>\n    <ul>\n{elementy}\n    </ul>\n  </section>')

          strona = f"""<!DOCTYPE html>
          <html lang="pl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Materiały na informatykę – ZSP Orzysz</title>
            <style>
              body {{ font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #1e293b; }}
              h1 {{ color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }}
              .klasa {{ background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }}
              .klasa h2 {{ margin-top: 0; font-size: 1.15rem; color: #0369a1; }}
              ul {{ list-style: none; padding: 0; margin: 0; }}
              li {{ display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #e2e8f0; }}
              li:last-child {{ border-bottom: none; }}
              a.btn {{ background: #0284c7; color: #fff; text-decoration: none; padding: 0.35rem 0.85rem; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }}
              a.btn:hover {{ background: #0369a1; }}
              .brak {{ color: #64748b; font-size: 0.9rem; font-style: italic; }}
            </style>
          </head>
          <body>
            <h1>Pliki startowe na lekcje informatyki</h1>
            <p>Kliknij <strong>Pobierz</strong> przy swoim zadaniu, a następnie otwórz plik z folderu <em>Pobrane</em>.</p>

          {chr(10).join(sekcje)}
          </body>
          </html>
          """
          with open("docs/index.html", "w", encoding="utf-8") as f:
              f.write(strona)
          EOF

      - name: Zapisz zaktualizowany index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Automatyczna aktualizacja listy plików dla uczniów"
          git push
