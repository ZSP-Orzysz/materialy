name: Aktualizuj listę plików dla uczniów

on:
  push:
    branches:
      - main
    paths:
      - 'docs/klasa-*/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Wygeneruj docs/index.html
        run: python3 .github/scripts/generuj_strone.py

      - name: Zapisz zaktualizowany index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Automatyczna aktualizacja listy plików dla uczniów"
            git pull --rebase origin main
            git push
          fi
